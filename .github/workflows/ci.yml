name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint:css
      - run: npm run lint:js
      - run: npm run test:unit
      - run: npm run test:property
      - run: npm run build
      - run: node tools/inline-critical.mjs
      - run: node tools/wire-async-css.mjs
      - run: npm run lint:html
      - run: npm run bundle:check
      - run: npm run links:check
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: node tools/inline-critical.mjs
      - run: node tools/wire-async-css.mjs
      - run: npm run test:lh
        continue-on-error: true # LH thresholds are advisory in CI; gate via assertions in lighthouserc.cjs
